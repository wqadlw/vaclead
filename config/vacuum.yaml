    - 冻干
    - 烧结

downstream_industries:
  # 科研教育医疗：政采/公共资源成交数据中的设备采购主力（高校实验室/院所/医院灭菌冻干）
  - key: research_edu
    name: 科研院所/高校医疗
    tier: 1
    industry_codes: ["R73", "R88", "Q84"]
    keywords: [大学, 学院, 研究所, 研究院, 科学技术, 科学院, 实验室, 医院, 疾控, 疾病预防, 检测中心, 质量检验, 计量]
  - key: semiconductor
    name: 半导体/集成电路
    tier: 1
    industry_codes: ["C39"]
    keywords: [半导体, 集成电路, 晶圆, 封测, 芯片制造, 半导体器件, 微电子]
  - key: coating
    name: 真空镀膜加工
    tier: 1
    industry_codes: ["C34"]
    keywords: [镀膜加工, 表面处理, 涂层加工, PVD加工, 光学镀膜, 真空镀膜厂, 电镀]
  - key: photovoltaic
    name: 光伏
    tier: 2
    industry_codes: ["C3825"]
    keywords: [光伏, 太阳能电池, 电池片, 光伏组件, 钙钛矿, 太阳能]
  - key: lithium
    name: 锂电池
    tier: 2
    industry_codes: ["C3841"]
    keywords: [锂电池, 锂电, 电芯, 电解液, 固态电池, 储能电池, 动力电池]
  - key: freeze_dried
    name: 冻干食品/医药
    tier: 2
    industry_codes: ["C14", "C27"]
    keywords: [冻干, 冷冻干燥, 食品加工, 制药, 生物医药, 药业, 保健品]
  - key: heat_treatment
    name: 金属热处理
    tier: 3
    industry_codes: ["C31"]
    keywords: [热处理, 退火, 淬火, 金属表面处理, 冶金]

# 竞对（同行）判定：企业名称命中任一 device_terms.strong 词
# 且经营范围含 manufacture_or_sale 中任一词 → is_competitor=1（打标保留、默认从推荐列表排除）
manufacture_or_sale: [制造, 生产, 厂家, 销售, 产销]

manufacturing_terms: [生产, 制造, 加工]
qualification_terms: [专精特新, 高新技术企业, 高新技术]

icp_weights:
  industry_tier1: 40      # 名称/经营范围/行业代码命中一线行业
  industry_tier2: 30      # 二线行业
  industry_generic: 10    # 泛制造（仅命中 manufacturing_terms）
  device_usage_terms: 20  # 经营范围含设备使用相关词但非竞对
  capital_gte_1000w: 15
  capital_100w_1000w: 8
  manufacturing_terms: 10
  qualification: 15
  max_score: 100

# ICP 分段评分（SPEC-F F2，吸收 opengtm qualify 四段模式）：
# 每段独立打分带理由，情报页分组展示；各段上限之和=100
icp_segments:
  size:                    # 企业规模段（注册资本/信号活跃度）
    capital_gte_1000w: 12
    capital_100w_1000w: 7
    signal_active_90d: 5   # 近90天有信号（活跃买家）
    max: 20
  industry:                # 行业适配段（下游行业词表命中）
    tier1: 40
    tier2: 30
    generic: 10
    research_edu_bonus: 5  # 科研教育（政采主力）加成
    max: 45
  digital:                 # 数字化/现代化痕迹（经营范围技术词）
    tech_terms: 10         # 含 研发/技术/智能/自动化 等
    online_trace: 5        # 有官网域名或 ICP 记录（P3 接入）
    max: 15
  pain:                    # 痛点/意图信号段
    device_usage: 10       # 经营范围含设备使用词
    tender_intent: 15      # 历史中标/采购信号强
    max: 20

signal_weights:
  tender_title_hit: 70    # 招标标题命中 strong 词
  tender_body_hit: 50     # 正文命中 strong 词 / 标题命中 weak 词减半
  weak_discount: 0.5
  intent_half_life_days: 30  # intent = Σ base_score × 0.5^(距今天数/30)

lead_grading:
  icp_weight: 0.4
  intent_weight: 0.6
  grade_s_min: 80
  grade_a_min: 60
  grade_b_min: 40

poi_cities: [苏州, 无锡, 东莞, 佛山, 深圳, 宁波, 常州, 南通, 西安, 合肥]

recycle_days: 30

# 预置客户画像模板（前端筛选页一键套用）
profile_templates:
  - name: 半导体扩产客户
    filters: {industry_key: semiconductor, capital_min: 1000, score_min: 60}
  - name: 镀膜加工厂
    filters: {industry_key: coating, score_min: 50}
  - name: 光伏电池制造商
    filters: {industry_key: photovoltaic, score_min: 50}
  - name: 锂电扩产客户
    filters: {industry_key: lithium, capital_min: 500, score_min: 50}
  - name: 冻干食品/药企
    filters: {industry_key: freeze_dried, score_min: 50}
  - name: 有采购信号的高意向客户
    filters: {signal_days: 30, score_min: 60}

# 招聘信号词表（SPEC-F F3，吸收 Job-Signal-Scraper 思想：在招设备岗=采购/扩张前兆）
hiring_keywords:
  - 真空设备工程师
  - 真空工艺工程师
  - 镀膜工程师
  - 真空技术员
  - 设备维护工程师
  - 真空镀膜技师
  - 半导体设备工程师
  - 光伏工艺工程师
