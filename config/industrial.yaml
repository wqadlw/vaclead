# 竞对（同行）判定：企业名称命中任一 device_terms.strong 词
# 且经营范围含 manufacture_or_sale 中任一词 → is_competitor=1（打标保留、默认从推荐列表排除）
manufacture_or_sale: [制造, 生产, 厂家, 销售, 产销, 装备, 设备有限]

manufacturing_terms: [生产, 制造, 加工]
qualification_terms: [专精特新, 高新技术企业, 高新技术]

icp_weights:
  industry_tier1: 40      # 名称/经营范围/行业代码命中一线行业
  industry_tier2: 30      # 二线行业
  industry_generic: 10    # 泛制造（仅命中 manufacturing_terms）
  device_usage_terms: 20  # 经营范围含设备使用相关词但非竞对
  capital_gte_1000w: 15
  capital_100w_1000w: 8
  manufacturing_terms: 10
  qualification: 15
  max_score: 100

# ICP 分段评分（SPEC-F F2，吸收 opengtm qualify 四段模式）：
# 每段独立打分带理由，情报页分组展示；各段上限之和=100
icp_segments:
  size:                    # 企业规模段（注册资本/信号活跃度）
    capital_gte_1000w: 12
    capital_100w_1000w: 7
    signal_active_90d: 5   # 近90天有信号（活跃买家）
    max: 20
  industry:                # 行业适配段（下游行业词表命中）
    tier1: 40
    tier2: 30
    generic: 10
    research_edu_bonus: 5  # 科研教育/医疗（政采主力）加成
    max: 45
  digital:                 # 数字化/现代化痕迹（经营范围技术词）
    tech_terms: 10         # 含 研发/技术/智能/自动化 等
    online_trace: 5        # 有官网域名或 ICP 记录（P3 接入）
    max: 15
  pain:                    # 痛点/意图信号段
    device_usage: 10       # 经营范围含设备使用词
    tender_intent: 15      # 历史中标/采购信号强
    max: 20

signal_weights:
  tender_title_hit: 70    # 招标标题命中 strong 词
  tender_body_hit: 50     # 正文命中 strong 词 / 标题命中 weak 词减半
  weak_discount: 0.5
  intent_half_life_days: 30  # intent = Σ base_score × 0.5^(距今天数/30)

lead_grading:
  icp_weight: 0.4
  intent_weight: 0.6
  grade_s_min: 80
  grade_a_min: 60
  grade_b_min: 40

poi_cities: [苏州, 无锡, 东莞, 佛山, 深圳, 宁波, 常州, 南通, 西安, 合肥]

recycle_days: 30

